name: Verify Crossword Clue Tutor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: crossword-clue-tutor-dist
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: crossword-clue-tutor-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://crosswordcluetutor.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: crossword-clue-tutor-dist
          path: dist
      - name: Capture the currently deployed sitemap
        run: >-
          curl --fail --silent --show-error https://crosswordcluetutor.com/sitemap.xml
          --output "$RUNNER_TEMP/previous-sitemap.xml"
          || : > "$RUNNER_TEMP/previous-sitemap.xml"
      - name: Deploy verified build to Cloudflare Pages
        run: >-
          npx wrangler pages deploy dist
          --project-name crossword-clue-tutor
          --branch main
          --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Detect explicitly recorded IndexNow updates
        id: indexnow_records
        run: >-
          if git diff --quiet HEAD^ HEAD -- ops/latest-publish.json ops/indexnow-manual.json;
          then echo "changed=false" >> "$GITHUB_OUTPUT";
          else echo "changed=true" >> "$GITHUB_OUTPUT";
          fi
      - name: Notify IndexNow of new and explicitly updated URLs
        run: >-
          npm run indexnow:submit --
          --previous-sitemap "$RUNNER_TEMP/previous-sitemap.xml"
          ${{ steps.indexnow_records.outputs.changed == 'true' && '--include-records' || '' }}
